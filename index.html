<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>TV Translate</title>


    <style>

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }


        body {
            overflow: hidden;
        }


        .player {
            width: 100%;
            height: 68vh;
            position: relative;
            background: #000;
        }


        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }


        #subtitle {

            position: absolute;

            left: 8%;
            right: 8%;

            bottom: 6%;

            text-align: center;

            color: white;

            background: rgba(0, 0, 0, 0.82);

            padding: 8px 16px;

            font-size: 24px;

            font-weight: bold;

            line-height: 1.3;

            border-radius: 6px;

            z-index: 10;

            box-sizing: border-box;

            max-height: 90px;

            overflow: hidden;

            white-space: normal;

            overflow-wrap: break-word;

            word-wrap: break-word;
        }


        #fullscreenBtn {

            position: absolute;

            top: 15px;
            right: 15px;

            z-index: 20;

            font-size: 18px;

            padding: 8px 14px;

            border: none;

            border-radius: 6px;

            background: rgba(0, 0, 0, 0.75);

            color: white;

            cursor: pointer;
        }


        .controls {

            height: 32vh;

            background: #202020;

            text-align: center;

            padding: 12px;

            box-sizing: border-box;
        }


        h1 {

            font-size: 30px;

            margin: 5px;
        }


        .language-title {

            font-size: 20px;

            margin: 8px;
        }


        button {

            font-size: 20px;

            padding: 10px 18px;

            margin: 4px;

            border: none;

            border-radius: 6px;

            cursor: pointer;
        }


        button:focus {

            outline: 3px solid white;
        }


        .selected {

            background: white;

            color: black;
        }


        #status {

            font-size: 18px;

            margin-top: 8px;
        }

    </style>

</head>



<body>


    <!-- ================================
         VIDEO PLAYER
    ================================= -->

    <div class="player">


        <iframe
            id="youtubePlayer"
            src="https://www.youtube.com/embed/N__uYg18pUA?enablejsapi=1&cc_load_policy=0"
            title="YouTube video player"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>


        <!-- ENGLISH TRANSLATION -->

        <div id="subtitle"></div>


        <!-- FULL SCREEN -->

        <button
            id="fullscreenBtn"
            onclick="goFullscreen()">
            ⛶ Full Screen
        </button>


    </div>



    <!-- ================================
         CONTROLS
    ================================= -->

    <div class="controls">


        <h1>
            TV TRANSLATE
        </h1>


        <div class="language-title">
            Select spoken language
        </div>


        <button
            id="hindi"
            onclick="selectLanguage('hi')">
            Hindi
        </button>


        <button
            id="tamil"
            onclick="selectLanguage('ta')">
            Tamil
        </button>


        <button
            id="malayalam"
            onclick="selectLanguage('ml')">
            Malayalam
        </button>


        <button
            id="telugu"
            onclick="selectLanguage('te')">
            Telugu
        </button>


        <div class="language-title">

            Translate to:
            <b>English</b>

        </div>


        <div id="status">
            Ready
        </div>


    </div>



    <!-- ================================
         JAVASCRIPT
    ================================= -->

    <script>


        /* =================================
           VIDEO
        ================================= */

        const VIDEO_ID =
            "N__uYg18pUA";


        let selectedLanguage =
            null;


        let captions =
            [];


        let translatedCache =
            {};


        let timer =
            null;


        let translationRequest =
            0;



        /* =================================
           SELECT LANGUAGE
        ================================= */

        function selectLanguage(language) {


            selectedLanguage =
                language;


            /* Remove selected state */

            document
                .getElementById("hindi")
                .classList.remove("selected");


            document
                .getElementById("tamil")
                .classList.remove("selected");


            document
                .getElementById("malayalam")
                .classList.remove("selected");


            document
                .getElementById("telugu")
                .classList.remove("selected");


            /* Add selected state */

            if (language === "hi") {

                document
                    .getElementById("hindi")
                    .classList.add("selected");

            }


            if (language === "ta") {

                document
                    .getElementById("tamil")
                    .classList.add("selected");

            }


            if (language === "ml") {

                document
                    .getElementById("malayalam")
                    .classList.add("selected");

            }


            if (language === "te") {

                document
                    .getElementById("telugu")
                    .classList.add("selected");

            }


            /* Cancel old translation */

            translationRequest++;


            /* Clear subtitle */

            document
                .getElementById("subtitle")
                .innerHTML =
                "";


            document
                .getElementById("status")
                .innerHTML =
                "Loading captions...";


            loadCaptions(language);

        }



        /* =================================
           LOAD TRANSCRIPT
        ================================= */

        async function loadCaptions(language) {


            try {


                const url =

                    "https://youtube-transcript.ai/transcript/" +

                    VIDEO_ID +

                    ".txt?lang=" +

                    language;


                const response =
                    await fetch(url);


                if (!response.ok) {

                    throw new Error(
                        "Caption request failed"
                    );

                }


                const text =
                    await response.text();


                captions =
                    parseTranscript(text);


                if (
                    captions.length === 0
                ) {

                    throw new Error(
                        "No captions found"
                    );

                }


                document
                    .getElementById("status")
                    .innerHTML =

                    captions.length +
                    " captions loaded";


                startSubtitleTimer();


            } catch (error) {


                console.error(error);


                document
                    .getElementById("status")
                    .innerHTML =
                    "Could not load captions";


                document
                    .getElementById("subtitle")
                    .innerHTML =
                    "Caption error";

            }

        }



        /* =================================
           PARSE TRANSCRIPT
           
           IMPORTANT:
           We do NOT split captions into
           70-character pieces.
        ================================= */

        function parseTranscript(text) {


            const lines =
                text.split("\n");


            const result =
                [];


            for (
                let line of lines
            ) {


                line =
                    line.trim();


                const match =
                    line.match(
                        /^\[(\d+):(\d+)\]\s*(.+)$/
                    );


                if (!match) {

                    continue;

                }


                const minutes =
                    parseInt(
                        match[1],
                        10
                    );


                const seconds =
                    parseInt(
                        match[2],
                        10
                    );


                const time =
                    minutes * 60 +
                    seconds;


                const caption =
                    match[3].trim();


                if (caption) {


                    result.push({

                        time: time,

                        text: caption

                    });

                }

            }


            return result;

        }



        /* =================================
           GET YOUTUBE VIDEO TIME
           
           Uses the postMessage method
           that worked with the TV.
        ================================= */

        function getCurrentVideoTime() {


            const iframe =
                document.getElementById(
                    "youtubePlayer"
                );


            return new Promise(
                function(resolve) {


                    let finished =
                        false;


                    function finish(time) {


                        if (finished) {
                            return;
                        }


                        finished =
                            true;


                        window.removeEventListener(
                            "message",
                            listener
                        );


                        resolve(time);

                    }


                    function listener(event) {


                        if (
                            event.source !==
                            iframe.contentWindow
                        ) {

                            return;

                        }


                        try {


                            const data =
                                JSON.parse(
                                    event.data
                                );


                            if (

                                data.event ===
                                "infoDelivery"

                                &&

                                data.info

                                &&

                                typeof data.info.currentTime ===
                                "number"

                            ) {


                                finish(
                                    data.info.currentTime
                                );

                            }


                        } catch (e) {}

                    }


                    window.addEventListener(
                        "message",
                        listener
                    );


                    /* Tell YouTube to start
                       sending information */

                    iframe.contentWindow.postMessage(

                        JSON.stringify({

                            event:
                                "listening",

                            channel:
                                "channel1"

                        }),

                        "*"

                    );


                    /* Ask for current time */

                    iframe.contentWindow.postMessage(

                        JSON.stringify({

                            event:
                                "command",

                            func:
                                "getCurrentTime",

                            args:
                                [],

                            channel:
                                "channel1"

                        }),

                        "*"

                    );


                    /* Safety timeout */

                    setTimeout(
                        function() {

                            finish(0);

                        },
                        1500
                    );

                }
            );

        }



        /* =================================
           START SUBTITLE TIMER
        ================================= */

        function startSubtitleTimer() {


            if (timer) {

                clearInterval(timer);

            }


            timer =
                setInterval(
                    async function() {


                        if (
                            !selectedLanguage ||
                            captions.length === 0
                        ) {

                            return;

                        }


                        try {


                            const currentTime =
                                await getCurrentVideoTime();


                            await showCurrentCaption(
                                currentTime
                            );


                        } catch (error) {


                            console.log(error);

                        }


                    },
                    500
                );

        }



        /* =================================
           SHOW CURRENT CAPTION
        ================================= */

        async function showCurrentCaption(
            currentTime
        ) {


            let current =
                null;


            /* Find caption matching
               current video time */

            for (
                let i = 0;
                i < captions.length;
                i++
            ) {


                if (
                    captions[i].time <=
                    currentTime
                ) {

                    current =
                        captions[i];

                } else {

                    break;

                }

            }


            if (!current) {

                return;

            }


            /* Unique cache key */

            const key =

                selectedLanguage +
                "|" +
                current.time +
                "|" +
                current.text;



            /* =================================
               ALREADY TRANSLATED
            ================================= */

            if (
                translatedCache[key]
            ) {


                document
                    .getElementById("subtitle")
                    .innerHTML =
                    translatedCache[key];


                return;

            }



            /* =================================
               SHOW TRANSLATING
            ================================= */

            document
                .getElementById("subtitle")
                .innerHTML =
                "Translating...";


            const requestNumber =
                ++translationRequest;


            const captionTime =
                current.time;


            const captionText =
                current.text;


            const captionLanguage =
                selectedLanguage;


            try {


                /* Translate */

                const translated =
                    await translateText(

                        captionText,

                        captionLanguage

                    );



                /* =================================
                   LANGUAGE CHANGED?
                ================================= */

                if (
                    requestNumber !==
                    translationRequest
                ) {

                    return;

                }



                /* =================================
                   GET LATEST VIDEO TIME
                ================================= */

                const latestTime =
                    await getCurrentVideoTime();



                /* =================================
                   FIND LATEST CAPTION
                ================================= */

                let latestCaption =
                    null;


                for (
                    let i = 0;
                    i < captions.length;
                    i++
                ) {


                    if (
                        captions[i].time <=
                        latestTime
                    ) {

                        latestCaption =
                            captions[i];

                    } else {

                        break;

                    }

                }



                /* =================================
                   VIDEO MOVED ON?
                ================================= */

                if (

                    !latestCaption

                    ||

                    latestCaption.time !==
                    captionTime

                    ||

                    latestCaption.text !==
                    captionText

                ) {

                    return;

                }



                /* Save translation */

                translatedCache[key] =
                    translated;


                /* Display */

                document
                    .getElementById("subtitle")
                    .innerHTML =
                    translated;


            } catch (error) {


                console.error(error);


                document
                    .getElementById("subtitle")
                    .innerHTML =
                    "";

            }

        }



        /* =================================
           TRANSLATE TEXT
        ================================= */

        async function translateText(
            text,
            language
        ) {


            if (
                language === "en"
            ) {

                return text;

            }


            try {


                return await translatePart(
                    text,
                    language
                );


            } catch (error) {


                console.error(error);


                return text;

            }

        }



        /* =================================
           GOOGLE TRANSLATION
        ================================= */

        async function translatePart(
            text,
            language
        ) {


            const url =

                "https://clients5.google.com/translate_a/t?client=dict-chrome-ex" +

                "&sl=" +

                language +

                "&tl=en" +

                "&q=" +

                encodeURIComponent(text);


            const response =
                await fetch(url);


            if (!response.ok) {

                throw new Error(
                    "Translation failed"
                );

            }


            const data =
                await response.json();


            if (
                Array.isArray(data) &&
                data[0]
            ) {

                return data[0];

            }


            return text;

        }



        /* =================================
           FULL SCREEN
        ================================= */

        function goFullscreen() {


            const playerArea =
                document.querySelector(
                    ".player"
                );


            if (
                playerArea.requestFullscreen
            ) {

                playerArea.requestFullscreen();

            }

        }


    </script>


</body>

</html>
