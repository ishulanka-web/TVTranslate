<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>TV Translate</title>

    <style>

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }

        body {
            overflow: hidden;
        }

        .player {
            width: 100%;
            height: 68vh;
            position: relative;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        #subtitle {
            position: absolute;

            left: 10%;
            right: 10%;
            bottom: 5%;

            max-width: 80%;

            margin: 0 auto;

            text-align: center;

            color: white;

            background: rgba(0, 0, 0, 0.82);

            padding: 8px 18px;

            font-size: 24px;
            font-weight: bold;

            line-height: 1.3;

            border-radius: 6px;

            z-index: 10;

            box-sizing: border-box;

            white-space: normal;

            overflow-wrap: break-word;

            word-wrap: break-word;
        }

        #fullscreenBtn {

            position: absolute;

            right: 15px;
            top: 15px;

            z-index: 20;

            font-size: 18px;

            padding: 8px 14px;

            border: none;

            border-radius: 6px;

            background: rgba(0, 0, 0, 0.75);

            color: white;

            cursor: pointer;
        }

        .controls {

            height: 32vh;

            background: #202020;

            text-align: center;

            padding: 12px;

            box-sizing: border-box;
        }

        h1 {

            font-size: 30px;

            margin: 5px;
        }

        .language-title {

            font-size: 20px;

            margin: 8px;
        }

        button {

            font-size: 20px;

            padding: 10px 18px;

            margin: 4px;

            border: none;

            border-radius: 6px;

            cursor: pointer;
        }

        button:focus {

            outline: 3px solid white;
        }

        .selected {

            background: white;

            color: black;
        }

        #status {

            font-size: 18px;

            margin-top: 8px;
        }

    </style>

</head>


<body>


    <!-- VIDEO PLAYER -->

    <div class="player">

        <iframe
            id="youtubePlayer"
            src="https://www.youtube.com/embed/N__uYg18pUA?enablejsapi=1&cc_load_policy=0"
            title="YouTube video player"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>


        <!-- OUR ENGLISH SUBTITLE -->

        <div id="subtitle"></div>


        <!-- FULLSCREEN -->

        <button
            id="fullscreenBtn"
            onclick="goFullscreen()">
            ⛶ Full Screen
        </button>

    </div>



    <!-- CONTROLS -->

    <div class="controls">

        <h1>TV TRANSLATE</h1>


        <div class="language-title">
            Select spoken language
        </div>


        <button
            id="hindi"
            onclick="selectLanguage('hi')">
            Hindi
        </button>


        <button
            id="tamil"
            onclick="selectLanguage('ta')">
            Tamil
        </button>


        <button
            id="malayalam"
            onclick="selectLanguage('ml')">
            Malayalam
        </button>


        <button
            id="telugu"
            onclick="selectLanguage('te')">
            Telugu
        </button>


        <div class="language-title">

            Translate to:
            <b>English</b>

        </div>


        <div id="status">
            Ready
        </div>

    </div>



    <!-- YOUTUBE IFRAME API -->

    <script src="https://www.youtube.com/iframe_api"></script>


    <script>


        /* =========================================
           VIDEO
        ========================================= */

        const VIDEO_ID = "N__uYg18pUA";


        let youtubePlayer = null;


        let selectedLanguage = null;


        let captions = [];


        let translatedCache = {};


        let timer = null;


        let translationRequest = 0;



        /* =========================================
           YOUTUBE PLAYER READY
        ========================================= */

        function onYouTubeIframeAPIReady() {

            youtubePlayer =
                new YT.Player("youtubePlayer", {

                    events: {

                        onReady: function () {

                            console.log(
                                "YouTube player ready"
                            );

                        }

                    }

                });

        }



        /* =========================================
           SELECT LANGUAGE
        ========================================= */

        function selectLanguage(language) {


            selectedLanguage = language;


            document
                .getElementById("hindi")
                .classList.remove("selected");


            document
                .getElementById("tamil")
                .classList.remove("selected");


            document
                .getElementById("malayalam")
                .classList.remove("selected");


            document
                .getElementById("telugu")
                .classList.remove("selected");


            if (language === "hi") {

                document
                    .getElementById("hindi")
                    .classList.add("selected");

            }


            if (language === "ta") {

                document
                    .getElementById("tamil")
                    .classList.add("selected");

            }


            if (language === "ml") {

                document
                    .getElementById("malayalam")
                    .classList.add("selected");

            }


            if (language === "te") {

                document
                    .getElementById("telugu")
                    .classList.add("selected");

            }


            /* Clear old subtitle */

            document
                .getElementById("subtitle")
                .innerHTML = "";


            /* New translation generation */

            translationRequest++;


            document
                .getElementById("status")
                .innerHTML =
                "Loading captions...";


            loadCaptions(language);

        }



        /* =========================================
           LOAD TRANSCRIPT
        ========================================= */

        async function loadCaptions(language) {


            try {


                const url =

                    "https://youtube-transcript.ai/transcript/" +

                    VIDEO_ID +

                    ".txt?lang=" +

                    language;


                const response =
                    await fetch(url);


                if (!response.ok) {

                    throw new Error(
                        "Caption request failed"
                    );

                }


                const text =
                    await response.text();


                captions =
                    parseTranscript(text);


                if (captions.length === 0) {

                    throw new Error(
                        "No captions found"
                    );

                }


                document
                    .getElementById("status")
                    .innerHTML =

                    captions.length +
                    " captions loaded";


                startSubtitleTimer();


            } catch (error) {


                console.error(error);


                document
                    .getElementById("status")
                    .innerHTML =
                    "Could not load captions";


                document
                    .getElementById("subtitle")
                    .innerHTML =
                    "Caption error";

            }

        }



        /* =========================================
           PARSE TRANSCRIPT
        ========================================= */

        function parseTranscript(text) {


            const lines =
                text.split("\n");


            const result = [];


            for (let line of lines) {


                line =
                    line.trim();


                const match =
                    line.match(
                        /^\[(\d+):(\d+)\]\s*(.+)$/
                    );


                if (!match) {

                    continue;

                }


                const minutes =
                    parseInt(
                        match[1],
                        10
                    );


                const seconds =
                    parseInt(
                        match[2],
                        10
                    );


                const time =
                    minutes * 60 +
                    seconds;


                const caption =
                    match[3].trim();


                if (caption) {


                    result.push({

                        time: time,

                        text: caption

                    });

                }

            }


            return result;

        }



        /* =========================================
           GET CURRENT VIDEO TIME
        ========================================= */

        function getCurrentVideoTime() {


            if (
                youtubePlayer &&
                typeof youtubePlayer.getCurrentTime ===
                "function"
            ) {

                return youtubePlayer.getCurrentTime();

            }


            return 0;

        }



        /* =========================================
           START SUBTITLE TIMER
        ========================================= */

        function startSubtitleTimer() {


            if (timer) {

                clearInterval(timer);

            }


            timer =
                setInterval(function () {


                    if (
                        !selectedLanguage ||
                        captions.length === 0
                    ) {

                        return;

                    }


                    const currentTime =
                        getCurrentVideoTime();


                    showCurrentCaption(
                        currentTime
                    );


                }, 500);

        }



        /* =========================================
           FIND CURRENT CAPTION
        ========================================= */

        async function showCurrentCaption(
            currentTime
        ) {


            let current = null;


            for (
                let i = 0;
                i < captions.length;
                i++
            ) {


                if (
                    captions[i].time <=
                    currentTime
                ) {

                    current =
                        captions[i];

                } else {

                    break;

                }

            }


            if (!current) {

                return;

            }


            const key =

                selectedLanguage +
                "|" +
                current.time +
                "|" +
                current.text;



            /* =====================================
               ALREADY TRANSLATED
            ===================================== */

            if (
                translatedCache[key]
            ) {


                document
                    .getElementById("subtitle")
                    .innerHTML =
                    translatedCache[key];


                return;

            }



            /* =====================================
               NEW TRANSLATION
            ===================================== */

            document
                .getElementById("subtitle")
                .innerHTML =
                "Translating...";


            const requestNumber =
                ++translationRequest;


            const captionTime =
                current.time;


            const captionText =
                current.text;


            const captionLanguage =
                selectedLanguage;


            try {


                const translated =
                    await translateText(

                        captionText,

                        captionLanguage

                    );



                /* =================================
                   CHECK IF USER CHANGED LANGUAGE
                ================================= */

                if (
                    requestNumber !==
                    translationRequest
                ) {

                    return;

                }



                /* =================================
                   CHECK VIDEO MOVED ON
                ================================= */

                const latestTime =
                    getCurrentVideoTime();


                let latestCaption =
                    null;


                for (
                    let i = 0;
                    i < captions.length;
                    i++
                ) {


                    if (
                        captions[i].time <=
                        latestTime
                    ) {

                        latestCaption =
                            captions[i];

                    } else {

                        break;

                    }

                }


                if (
                    !latestCaption ||
                    latestCaption.time !==
                    captionTime ||
                    latestCaption.text !==
                    captionText
                ) {

                    return;

                }



                /* =================================
                   SAVE TRANSLATION
                ================================= */

                translatedCache[key] =
                    translated;


                document
                    .getElementById("subtitle")
                    .innerHTML =
                    translated;


            } catch (error) {


                console.error(error);


                document
                    .getElementById("subtitle")
                    .innerHTML =
                    "";

            }

        }



        /* =========================================
           TRANSLATE TEXT
        ========================================= */

        async function translateText(
            text,
            language
        ) {


            if (language === "en") {

                return text;

            }


            try {


                /*
                 Google translation endpoint
                */

                return await translatePart(
                    text,
                    language
                );


            } catch (error) {


                console.error(error);


                return text;

            }

        }



        /* =========================================
           GOOGLE TRANSLATION
        ========================================= */

        async function translatePart(
            text,
            language
        ) {


            const url =

                "https://clients5.google.com/translate_a/t?client=dict-chrome-ex" +

                "&sl=" +

                language +

                "&tl=en" +

                "&q=" +

                encodeURIComponent(text);


            const response =
                await fetch(url);


            if (!response.ok) {

                throw new Error(
                    "Translation failed"
                );

            }


            const data =
                await response.json();


            if (
                Array.isArray(data) &&
                data[0]
            ) {

                return data[0];

            }


            return text;

        }



        /* =========================================
           FULLSCREEN
        ========================================= */

        function goFullscreen() {


            const playerArea =
                document.querySelector(
                    ".player"
                );


            if (
                playerArea.requestFullscreen
            ) {

                playerArea.requestFullscreen();

            }

        }


    </script>


</body>

</html>
