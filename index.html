<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TV Translate</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }

        .player {
            width: 100%;
            height: 68vh;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .controls {
            height: 32vh;
            background: #202020;
            text-align: center;
            padding: 12px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 30px;
            margin: 5px;
        }

        .language-title {
            font-size: 20px;
            margin: 8px;
        }

        button {
            font-size: 20px;
            padding: 10px 18px;
            margin: 4px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:focus {
            outline: 3px solid white;
        }

        .selected {
            background: #ffffff;
            color: #000000;
        }

        #subtitle {
            margin-top: 10px;
            font-size: 24px;
            min-height: 35px;
        }
    </style>
</head>

<body>

    <div class="player">
        <iframe
            src="https://www.youtube.com/embed/YE7VzlLtp-4?cc_load_policy=1&cc_lang_pref=en"
            title="YouTube video player"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>
    </div>

    <div class="controls">

        <h1>TV TRANSLATE</h1>

        <div class="language-title">
            Select spoken language
        </div>

        <button id="hindi" onclick="selectLanguage('Hindi')">
            Hindi
        </button>

        <button id="tamil" onclick="selectLanguage('Tamil')">
            Tamil
        </button>

        <button id="malayalam" onclick="selectLanguage('Malayalam')">
            Malayalam
        </button>

        <button id="telugu" onclick="selectLanguage('Telugu')">
            Telugu
        </button>

        <div class="language-title">
            Translate to: <b>English</b>
        </div>

        <div id="subtitle">
            Select a language
        </div>

    </div>

    <script>

        function selectLanguage(language) {

            document.getElementById("hindi").classList.remove("selected");
            document.getElementById("tamil").classList.remove("selected");
            document.getElementById("malayalam").classList.remove("selected");
            document.getElementById("telugu").classList.remove("selected");

            if (language === "Hindi") {
                document.getElementById("hindi").classList.add("selected");
            }

            if (language === "Tamil") {
                document.getElementById("tamil").classList.add("selected");
            }

            if (language === "Malayalam") {
                document.getElementById("malayalam").classList.add("selected");
            }

            if (language === "Telugu") {
                document.getElementById("telugu").classList.add("selected");
            }

            document.getElementById("subtitle").innerHTML =
                language + " selected — English translation ready";
        }

    </script>

</body>
</html>
