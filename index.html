<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Translate</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }

        .player {
            width: 100%;
            height: 75vh;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .controls {
            text-align: center;
            padding: 15px;
        }

        h1 {
            font-size: 32px;
            margin: 5px;
        }

        p {
            font-size: 22px;
        }
    </style>
</head>

<body>

    <div class="player">
        <iframe
            src="https://www.youtube.com/embed/YE7VzlLtp-4?cc_load_policy=1&cc_lang_pref=en"
            title="YouTube video player"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>
    </div>

    <div class="controls">
        <h1>TV TRANSLATE</h1>
        <p>English captions test</p>
        <p>Big Buck Bunny</p>
    </div>

</body>
</html>
